name: Deploy develop to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunmelt-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sunmelt/package-lock.json
      - name: Install dependencies
        working-directory: sunmelt
        run: npm ci
      - name: Run carousel tests
        working-directory: sunmelt
        run: node --test component/ui/product-carousel/*.test.mjs
      - name: Build static site
        working-directory: sunmelt
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Verify exported files
        working-directory: sunmelt
        run: |
          test -f out/index.html
          test -f out/textures/uv/mango.webp
          test -f out/backgrounds/mango.webp
          test -f out/backgrounds/C36474C1-21B3-4870-B89D-90F5730E7CB6.png
          test -d out/_next/static
          touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: sunmelt/out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
